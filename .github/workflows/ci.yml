name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: recallgraph
          POSTGRES_PASSWORD: recallgraph
          POSTGRES_DB: recallgraph_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U recallgraph -d recallgraph_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://recallgraph:recallgraph@127.0.0.1:5433/recallgraph_test
      RECALLGRAPH_DATABASE_URL: postgresql+asyncpg://recallgraph:recallgraph@127.0.0.1:5433/recallgraph_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.12.19/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --no-cache .

      - name: Ruff format check
        run: uv run ruff format --check --no-cache .

      - name: Mypy (strict)
        run: uv run mypy src tests

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic check (models match migrations)
        run: uv run alembic check

      - name: Pytest (unit + integration)
        run: uv run pytest --cov=recallgraph --cov-fail-under=83

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: recallgraph
          POSTGRES_PASSWORD: recallgraph
          POSTGRES_DB: recallgraph
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U recallgraph" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RECALLGRAPH_DATABASE_URL: postgresql+asyncpg://recallgraph:recallgraph@127.0.0.1:5433/recallgraph
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Migrate
        working-directory: backend
        run: uv sync --frozen && uv run alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
