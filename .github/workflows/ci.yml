name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: recallgraph
          POSTGRES_PASSWORD: recallgraph
          POSTGRES_DB: recallgraph_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U recallgraph -d recallgraph_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://recallgraph:recallgraph@127.0.0.1:5433/recallgraph_test
      RECALLGRAPH_DATABASE_URL: postgresql+asyncpg://recallgraph:recallgraph@127.0.0.1:5433/recallgraph_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.12.19/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --no-cache .

      - name: Ruff format check
        run: uv run ruff format --check --no-cache .

      - name: Mypy (strict)
        run: uv run mypy src tests

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic check (models match migrations)
        run: uv run alembic check

      - name: Pytest (unit + integration)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
